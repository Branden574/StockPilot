# Dependabot — security-first posture (cybersecurity monitoring Phase 1).
# Alerts + automated security fixes are enabled at the repo level; this file
# adds SCHEDULED checks so vulnerable/stale dependencies surface weekly even
# without a published advisory. PR volume is deliberately capped: this is a
# monorepo with pinned-by-policy packages (eas-cli, the EAS Xcode image), so
# we want a small, reviewable stream — security updates always come through
# regardless of these caps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Group routine bumps so the stream stays reviewable; security updates
    # are never grouped away.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Pinned by the iOS release runbook — EAS image/Xcode constraints mean
      # bumping this blindly breaks signed builds. Bump manually with the
      # runbook open.
      - dependency-name: eas-cli
      # NO automated major bumps for anything: majors change APIs (first week
      # proved it — pdf-parse 2.x and @hookform/resolvers 5.x both failed the
      # preview build). Majors are deliberate, manual upgrades. Security
      # advisories still open PRs regardless of this ignore.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Expo-SDK-managed packages are versioned BY the SDK — they only ever
      # move together via `npx expo install --fix` during a deliberate SDK
      # upgrade. Even minors break the native build or typecheck (PR #5's
      # group bumped RN-coupled deps and failed mobile typecheck).
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
