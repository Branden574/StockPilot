# Post-deploy prewarm (cold-start plan rank 1, 2026-07-06).
#
# WHY: unstable_cache keys embed the compiled source of their callbacks, so a
# deploy that changes how the inventory loaders (or the orders-catalog and
# item-image helpers) COMPILE rotates their keys, and the first human on
# /dashboard/inventory, /dashboard/books or /dashboard/orders/new would pay the
# cold loader wave (~1.5-2.5s). This job makes a robot pay it instead, ~30-90s
# after the deploy goes READY.
#
# NOT every deploy rotates them: measured 2026-09-21 on an ordinary deploy,
# 18 of 18 signed photo URLs kept their keys. It still runs on every deploy,
# because a framework or build change can rotate keys without touching a
# loader file, and one run costs ~170 service-role calls. What it no longer
# does is overlap: 2026-09-22 had 7 production deploys in 2.5 hours and each
# fired a full run. The concurrency group below cancels a run that a newer
# deploy has already superseded (only the latest deploy's keys matter).
#
# HOW: the Vercel GitHub integration creates GitHub Deployment objects and
# posts `deployment_status` events. On state=success for the Production
# environment we curl the existing secret-gated prewarm route (the route's own
# comment says it is intended for exactly this trigger). The route is
# idempotent, so the 3x retry is safe. It is NOT cheap: a warm cache still
# refreshes stale entries in the background, ~170 calls a run.
#
# SETUP (owner action, one-time): add repo secret BACKFILL_ADMIN_SECRET with
# the same value as the Vercel env var of the same name. Without it the job
# fails fast with a clear message instead of silently curling unauthenticated.
#
# WATCH-FOR: Vercel Bot Protection has 429'd non-browser clients before (the
# mobile RN incident). If this job starts failing with 429s, the pending
# "/api firewall bypass" owner task covers it; the retries paper over
# transient cases meanwhile.
name: Prewarm caches on production deploy

on:
  deployment_status:

permissions: {}

# One run at a time; a newer production deploy cancels the older run.
concurrency:
  group: prewarm-on-deploy
  cancel-in-progress: true

jobs:
  prewarm:
    # The Vercel integration names the prod environment "Production".
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prewarm inventory + orders caches
        env:
          BACKFILL_ADMIN_SECRET: ${{ secrets.BACKFILL_ADMIN_SECRET }}
          # Canonical prod domain on purpose — NOT the per-deployment
          # *.vercel.app URL (deployment URLs can sit behind Deployment
          # Protection, and the prod domain is what users actually hit, so
          # it warms the caches the first human will read).
          PREWARM_URL: https://stockpilotusa.com/api/cron/prewarm-orders-catalog
        run: |
          set -u
          if [ -z "${BACKFILL_ADMIN_SECRET}" ]; then
            echo "::error::BACKFILL_ADMIN_SECRET repo secret is not set — add it (same value as the Vercel env var)."
            exit 1
          fi
          # 3x retry with backoff: a deploy is also when instances are
          # coldest, so the first attempt can hit a slow boot or a transient
          # 429/5xx. --max-time stays under the route's maxDuration=60.
          for attempt in 1 2 3; do
            echo "Prewarm attempt ${attempt}..."
            if curl -fsS --max-time 90 \
              -H "Authorization: Bearer ${BACKFILL_ADMIN_SECRET}" \
              "${PREWARM_URL}"; then
              echo ""
              echo "Prewarm OK on attempt ${attempt}."
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "::error::Prewarm failed after 3 attempts."
          exit 1
