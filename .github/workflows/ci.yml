name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Guard against committed .env secrets
        run: bash scripts/check-no-committed-env.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # ---------------------------------------------------------------------------
  # pgTAP database tests (supabase/tests/*.test.sql). Boots the local Supabase
  # stack via the pinned `supabase` CLI devDependency — `supabase start` applies
  # every migration in supabase/migrations/ to a fresh Postgres (the same path as
  # `db:reset`), and `supabase test db` runs the pgTAP suites (pgtap extension is
  # bundled in the Supabase Postgres image) inside a rolled-back transaction.
  # Needs Docker, which ubuntu-latest GitHub runners provide out of the box.
  db-tests:
    name: DB pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Brings up Postgres + applies all supabase/migrations/*.sql.
      - name: Start Supabase stack
        run: pnpm exec supabase start

      # Runs supabase/tests/*.test.sql via pg_prove against the started DB.
      - name: Run pgTAP tests
        run: pnpm exec supabase test db

      # The named security gate (scripts/security-test.sh): the allowlist-based
      # invariant sweeps plus the security-focused pgTAP and vitest suites. It
      # lives in THIS job because its database half needs the stack that the
      # step above already started, and the runner already has node_modules.
      #
      # It deliberately re-runs files the two steps above also cover. The value
      # is the label: a red "Security invariants" step means a security property
      # broke, which is a different merge decision from a red test suite. Do not
      # remove the overlap.
      - name: Security invariants
        run: pnpm security:test

      - name: Stop Supabase stack
        if: always()
        run: pnpm exec supabase stop --no-backup
