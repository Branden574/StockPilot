name: Security Scan

# SAST (Semgrep) + secret scanning (TruffleHog) + a dependency audit
# (pnpm audit). Complements Dependabot (dependency CVEs, as alerts) +
# scripts/check-no-committed-env.sh (.env guard) with code-level static
# analysis, live-credential detection and a dependency check that fails a run.
#
# All three are chosen to work on a PRIVATE repo with NO paid add-on:
#   - Semgrep runs the OSS registry rulesets (no Semgrep account/token needed).
#   - TruffleHog --only-verified flags ONLY credentials it can confirm are live
#     (near-zero false positives), so failing the build on a hit is safe.
#   - pnpm audit asks the npm registry's advisory service about the lockfile
#     (no account, no token). scripts/dependency-audit/report.mjs decides: it
#     fails on a critical advisory unless scripts/dependency-audit/allow-list.json
#     dismisses it, and reports high ones. It is not a required check, so a new
#     advisory against an unchanged dependency does not block a merge.
# (CodeQL is deliberately omitted: uploading its SARIF to the Security tab needs
#  GitHub Advanced Security on private repos. Add it if this repo goes public or
#  gets GHAS.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday sweep so new rules, secrets and dependency advisories
    # surface even without a push.
    - cron: '0 7 * * 1'
  # Run it by hand (Actions > Security Scan > Run workflow), for example after
  # upgrading a package the audit flagged.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # Hard gate since 2026-07-20: the baseline is clean (the one pre-existing
    # ERROR finding — the curl|sh TruffleHog install below — is fixed), so
    # ERROR-severity findings now fail the build.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Semgrep
        # Pinned version (not floating latest) for reproducible, supply-chain-safe
        # runs. Bump deliberately.
        run: pip install --quiet semgrep==1.168.0

      - name: Run Semgrep (security rulesets)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nextjs \
            --config p/secrets \
            --severity ERROR \
            --error \
            --sarif --output semgrep.sarif \
            --exclude node_modules --exclude .next --exclude dist

      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install TruffleHog (pinned release, checksum-verified)
        env:
          # IMMUTABLE version + INLINE sha256 pin. No installer script runs at
          # all (the previous curl|sh was our own Semgrep gate's one blocking
          # finding): we download the release tarball for exactly this version
          # and refuse to install unless it matches the hash recorded here, so
          # neither an upstream branch compromise nor a swapped release asset
          # can execute code in CI. Bump = update BOTH values from the release
          # checksums file (Dependabot doesn't track curl-pinned versions).
          TRUFFLEHOG_VERSION: '3.95.6'
          TRUFFLEHOG_SHA256: '1b62ea3cbc672ed5fd36e0eebb00b1fb50bbb7ee35090f42437a5852a299e16b'
        run: |
          curl -sSfL -o trufflehog.tar.gz "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  trufflehog.tar.gz" | sha256sum -c -
          tar -xzf trufflehog.tar.gz trufflehog
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog
          rm -f trufflehog trufflehog.tar.gz

      # Scan the working tree for VERIFIED (confirmed-live) secrets. node_modules
      # isn't installed in this job, so the scan stays fast and source-focused.
      # --fail => non-zero exit (build fails) if any verified secret is found.
      - name: Scan tree for verified secrets
        run: trufflehog filesystem . --only-verified --fail --no-update

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Holds nothing worth leaking. A read-only token that checkout does not
    # write into .git/config, no `secrets.*` anywhere in the job, and no
    # install, so no package's install script ever runs here: pnpm audit reads
    # pnpm-lock.yaml and needs no node_modules.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # pnpm audit exits non-zero whenever it finds an advisory at
      # --audit-level or above, so its exit status is not the verdict:
      # report.mjs reads the JSON and decides. Output that is not a report (the
      # registry did not answer, nothing printed) fails the next step, so a
      # broken audit can never pass with nothing checked.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high --json > pnpm-audit.json || true

      - name: Report (fails on a critical advisory the allow-list does not dismiss)
        run: |
          set +e
          node scripts/dependency-audit/report.mjs pnpm-audit.json > dependency-audit.md
          status=$?
          cat dependency-audit.md >> "$GITHUB_STEP_SUMMARY"
          # The log copy is printed with workflow commands switched off, so no
          # text from the registry is read as a runner command. The marker
          # that switches them back on is random per run, so the printed text
          # cannot contain it.
          marker="$(openssl rand -hex 16)"
          echo "::stop-commands::${marker}"
          cat dependency-audit.md
          echo "::${marker}::"
          exit "$status"
