<option value="normal" selected="">Normal</option>
<option value="high">High</option>
<option value="urgent">Urgent — blocking my team</option>
</select>
</div>
</div>
<div class="space-y-2">
<label class="text-[13px] font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="sup-subject">Subject <span class="text-destructive">*</span>

<div class="space-y-2">
