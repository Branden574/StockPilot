<?xml version="1.0" encoding="UTF-8"?>
<!--
  StockPilot favicon — Mark D · Stencil Frame.
  A solid rounded square with the letter S carved out as negative
  space, plus a small "pip" waypoint at the upper-right terminal.
  The S draws itself in / erases on a 3.6s loop; readable at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <style>
    .frame { fill: #0c0c0e; }
    .spath {
      stroke-dasharray: 230;
      stroke-dashoffset: 230;
      animation: sp-draw 3.6s cubic-bezier(0.7, 0.05, 0.3, 1) infinite;
    }
    .pip {
      opacity: 0;
      animation: sp-pip 3.6s linear infinite;
    }
    @keyframes sp-draw {
      0%   { stroke-dashoffset: 230; }
      45%  { stroke-dashoffset: 0;   }
      80%  { stroke-dashoffset: 0;   }
      100% { stroke-dashoffset: -230;}
    }
    @keyframes sp-pip {
      0%, 42%   { opacity: 0; }
      50%, 78%  { opacity: 1; }
      88%, 100% { opacity: 0; }
    }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #f6f4ef; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spath { animation: none; stroke-dashoffset: 0; }
      .pip   { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="white"/>
      <path
        d="M 32 78 Q 72 78 72 66 Q 72 54 54 54 Q 32 54 32 42 Q 32 24 72 24"
        stroke="black" stroke-width="11" stroke-linecap="round" fill="none"
        class="spath"/>
      <circle cx="72" cy="24" r="6" fill="black" class="pip"/>
    </mask>
  </defs>
  <rect class="frame" x="12" y="12" width="76" height="76" rx="16" mask="url(#m)"/>
</svg>
