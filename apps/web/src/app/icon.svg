<?xml version="1.0" encoding="UTF-8"?>
<!--
  StockPilot favicon — Mark D · Stencil Frame, fully static.
  A solid rounded square with the letter S carved out as negative
  space, plus a small "pip" waypoint at the upper-right terminal.
  No animation: Chromium + Safari ignore @keyframes inside favicon
  SVGs (only Firefox honors them) and the JS-canvas swap workaround
  triggered Vercel's WAF bot challenge on related image fetches,
  which broke item/book photos. Static reads correctly across every
  browser at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <style>
    .frame { fill: #0c0c0e; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #f6f4ef; }
    }
  </style>
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="white"/>
      <path
        d="M 32 78 Q 72 78 72 66 Q 72 54 54 54 Q 32 54 32 42 Q 32 24 72 24"
        stroke="black" stroke-width="11" stroke-linecap="round" fill="none"/>
      <circle cx="72" cy="24" r="6" fill="black"/>
    </mask>
  </defs>
  <rect class="frame" x="12" y="12" width="76" height="76" rx="16" mask="url(#m)"/>
</svg>
