<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StockPilot email motion — scanner</title>
<style>
  html, body { margin: 0; padding: 0; }
  html { background: transparent; }
  body {
    width: 1200px; height: 440px; overflow: hidden;
    background: #eeece5;
    display: flex; align-items: center; justify-content: center;
  }
  
@keyframes es-ring{0%{transform:scale(0.55);opacity:0.9}80%{transform:scale(1.5);opacity:0}100%{transform:scale(1.5);opacity:0}}
@keyframes es-drop{0%{transform:translateY(-14px);opacity:0}60%{transform:translateY(2px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes es-fadein{from{opacity:0}to{opacity:1}}
@keyframes es-draw{to{stroke-dashoffset:0}}
@keyframes es-travel{0%{transform:translateX(0)}45%,55%{transform:translateX(var(--es-tx,240px))}100%{transform:translateX(var(--es-tx2,480px))}}
@keyframes es-march{to{stroke-dashoffset:-24px}}
@keyframes es-scan{0%,100%{transform:translateX(-46px)}50%{transform:translateX(46px)}}
@keyframes es-swing{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}
@keyframes es-rise{from{transform:scaleY(0.06)}to{transform:scaleY(1)}}
@keyframes es-hand{0%{transform:rotate(0deg)}45%,100%{transform:rotate(80deg)}}
@keyframes es-pop{0%{transform:scale(0.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes es-blinkonce{0%,40%{opacity:0}60%,100%{opacity:1}}
@keyframes es-click{0%{transform:translateY(-6px)}60%{transform:translateY(1.5px)}100%{transform:translateY(0)}}
@keyframes es-march-p{to{stroke-dashoffset:-24px}}
@keyframes es-tick-dot{0%{transform:scale(1)}30%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes es-tick-ring{0%{transform:scale(1);opacity:0.85}100%{transform:scale(1.6);opacity:0}}

  /* Rest state = the design's reduced-motion fallback (es-core.jsx applies
     animation:none under prefers-reduced-motion) + finished dash draws. */
  .es-rest * { animation: none !important; }
  .es-rest .draw { stroke-dashoffset: 0 !important; }
</style>
</head>
<body>
<svg class="es-anim" viewBox="0 0 220 120" width="691" height="377" style="display:block;overflow:visible"><g fill="none" stroke="#0c0c0e" stroke-opacity="0.8" stroke-width="2">
    <rect x="82" y="36" width="56" height="46" rx="4" fill="#eeece5"></rect>
    <line x1="110" y1="36" x2="110" y2="46"></line>
    <line x1="92" y1="62" x2="92" y2="74" stroke-width="3" stroke-opacity="0.65"></line><line x1="99" y1="62" x2="99" y2="74" stroke-width="1.5" stroke-opacity="0.65"></line><line x1="104" y1="62" x2="104" y2="74" stroke-width="3" stroke-opacity="0.65"></line><line x1="113" y1="62" x2="113" y2="74" stroke-width="1.5" stroke-opacity="0.65"></line><line x1="120" y1="62" x2="120" y2="74" stroke-width="3" stroke-opacity="0.65"></line><line x1="127" y1="62" x2="127" y2="74" stroke-width="1.5" stroke-opacity="0.65"></line>
    <g stroke-opacity="0.45" style="animation:es-blinkonce .5s ease both">
      <path d="M 66 30 h -10 v 10"></path><path d="M 154 30 h 10 v 10"></path>
      <path d="M 66 90 h -10 v -10"></path><path d="M 154 90 h 10 v -10"></path>
    </g>
    <line x1="110" y1="26" x2="110" y2="94" stroke="#3f5f78" stroke-width="2" stroke-opacity="0.9"
      style="animation:es-scan 2.2s ease-in-out infinite"></line>
  </g></svg>
</body>
</html>
